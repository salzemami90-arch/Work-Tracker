<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Projects, goals, steps, and progress — stored locally in this browser.">
  <title>Work Tracker</title>
  <link rel="stylesheet" href="./app.css?v=1.0.3">
  <link rel="icon" href="./mark.svg">
  <script type="module" src="./js/app.js?v=1.0.3"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <aside id="workspace-sidebar"></aside>
  <header id="app-header"></header>
  <div id="preview-notice" hidden></div>
  <main id="main" tabindex="-1"><div class="loading">Opening workspace…</div></main>
  <footer id="app-footer"></footer>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="editor" aria-labelledby="editor-title"></dialog>
</body>
</html>
